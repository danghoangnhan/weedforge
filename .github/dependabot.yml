version: 2
updates:
  # Keep GitHub Actions current (and, once pinned to SHAs, keep the SHAs fresh).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The `@1.86` / `@stable` refs on dtolnay/rust-toolchain are Rust TOOLCHAIN
      # selectors, not action versions. Dependabot must not "bump" them (it tried
      # 1.86 -> 1.100, a nonexistent toolchain, which broke the MSRV job).
      - dependency-name: "dtolnay/rust-toolchain"

  # Rust core.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  # Go client.
  - package-ecosystem: gomod
    directory: /clients/go
    schedule:
      interval: weekly

  # Java client.
  - package-ecosystem: maven
    directory: /clients/java
    schedule:
      interval: weekly
