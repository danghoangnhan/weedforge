name: Clients

# src/** is in the trigger on purpose. The Go and Java clients are kept in parity
# with the Rust core through clients/conformance/fileid_vectors.json, so the code
# most likely to break conformance is the core itself -- and while this workflow
# only watched clients/**, a change to src/domain/entities.rs could alter the
# FileId wire format without ever running the tests that would catch it.
on:
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - 'src/**'
      - '.github/workflows/clients.yml'
  pull_request:
    branches: [main]
    paths:
      - 'clients/**'
      - 'src/**'
      - '.github/workflows/clients.yml'

jobs:
  java:
    name: Java client (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17']
    defaults:
      run:
        working-directory: clients/java
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

  go:
    name: Go client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/go
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Test
        run: go test ./... -v

      - name: Cross-compile (CGO disabled, multiple targets)
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... && echo "built $target"
          done
