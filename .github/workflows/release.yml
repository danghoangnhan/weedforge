name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Single source of truth: the version lives in Cargo.toml (pyproject reads it via
  # `dynamic = ["version"]`). This job enforces that the committed version matches the
  # release tag, so crates.io, the PyPI wheels, and the runtime __version__ all agree
  # and every release is reproducible from its immutable tag.
  check-version:
    name: Check version matches tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VER="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.+)"/\1/')"
          echo "Release tag:      $TAG"
          echo "Cargo.toml version: $CARGO_VER"
          if [ "$TAG" != "$CARGO_VER" ]; then
            echo "::error::Release tag ($TAG) does not match Cargo.toml [package] version ($CARGO_VER). Bump the version in Cargo.toml, commit, then create the matching tag/release."
            exit 1
          fi
          echo "version=$CARGO_VER" >> "$GITHUB_OUTPUT"

  publish-crates:
    name: Publish to crates.io
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        # Version is already committed in Cargo.toml (== tag, enforced above), so this is
        # a clean, reproducible publish — no runtime version mutation, no crates.io API.
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Build wheels for Linux (manylinux, x86_64)
  build-linux:
    name: Build Linux wheels
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist
          manylinux: auto
          sccache: 'false'
          rust-toolchain: stable
        env:
          RUST_BACKTRACE: 1

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  # Build wheels for macOS
  build-macos:
    name: Build macOS wheels
    needs: check-version
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}-apple-darwin
          args: --release --strip --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  # Build wheels for Windows
  build-windows:
    name: Build Windows wheels
    needs: check-version
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --strip --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist/*.whl

  # Build source distribution
  build-sdist:
    name: Build source distribution
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  # Publish to PyPI
  publish-pypi:
    name: Publish to PyPI
    needs: [check-version, build-linux, build-macos, build-windows, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_PASSWORD }}
